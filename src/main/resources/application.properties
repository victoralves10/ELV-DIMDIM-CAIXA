# Conexao com o Azure SQL Database
# Os valores vem das App Settings do Web App (nunca escreva credenciais aqui)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# As tabelas sao criadas pelo script scripts/ddl.sql (Hibernate nao altera o schema)
spring.jpa.hibernate.ddl-auto=update

# Exibe os comandos SQL no log (ajuda a mostrar as operacoes no video)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
