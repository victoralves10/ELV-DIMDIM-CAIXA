<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head(${cliente.id == null} ? 'Novo cliente' : 'Editar cliente')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('clientes')}"></header>

<main class="container" style="max-width: 640px;">
    <h2 class="dd-titulo" th:text="${cliente.id == null} ? 'Novo cliente' : 'Editar cliente'">Novo cliente</h2>

    <div th:replace="~{fragments/layout :: alertas}"></div>

    <div class="dd-card p-4">
        <form th:action="${cliente.id == null} ? @{/clientes} : @{/clientes/{id}(id=${cliente.id})}"
              th:object="${cliente}" method="post" novalidate>

            <div class="mb-3">
                <label for="nome" class="form-label">Nome completo</label>
                <input type="text" th:field="*{nome}" class="form-control"
                       th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'" placeholder="Ex.: Maria da Silva">
                <div class="invalid-feedback" th:errors="*{nome}"></div>
            </div>

            <div class="mb-3">
                <label for="cpf" class="form-label">CPF <small class="text-muted">(somente números)</small></label>
                <input type="text" th:field="*{cpf}" class="form-control" maxlength="11" inputmode="numeric"
                       th:classappend="${#fields.hasErrors('cpf')} ? 'is-invalid'" placeholder="12345678901">
                <div class="invalid-feedback" th:errors="*{cpf}"></div>
            </div>

            <div class="mb-4">
                <label for="email" class="form-label">Email</label>
                <input type="email" th:field="*{email}" class="form-control"
                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" placeholder="maria@email.com">
                <div class="invalid-feedback" th:errors="*{email}"></div>
            </div>

            <button type="submit" class="btn btn-dd"><i class="fas fa-save"></i> Salvar</button>
            <a th:href="@{/clientes}" class="btn btn-outline-secondary">Cancelar</a>
        </form>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
