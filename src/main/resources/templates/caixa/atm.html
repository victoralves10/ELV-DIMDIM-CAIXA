<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <style th:fragment="estilo">
        .atm-fundo { background: radial-gradient(circle at top, #3a3a3a, #1c1c1c); }
        .atm {
            max-width: 460px; margin: 2rem auto; padding: 22px;
            background: linear-gradient(180deg, #4a4a4a, #2b2b2b);
            border-radius: 26px; box-shadow: 0 20px 40px rgba(0,0,0,.45), inset 0 2px 0 rgba(255,255,255,.08);
        }
        .atm-topo { text-align: center; color: #FFE14D; font-weight: 800; letter-spacing: 3px; margin-bottom: 14px; }
        .atm-topo .dd-logo { width: 42px; height: 42px; font-size: 1rem; }
        .atm-tela {
            background: #0d2a3a; color: #d8f3ff; border-radius: 12px; padding: 22px 20px;
            border: 6px solid #111; box-shadow: inset 0 0 30px rgba(0,180,255,.15);
            font-family: 'Courier New', monospace; min-height: 220px;
        }
        .atm-tela h5 { color: #FFE14D; font-weight: 700; }
        .atm-tela .form-control {
            background: #071a24; color: #fff; border: 1px solid #2f6b85;
            font-family: 'Courier New', monospace; font-size: 1.3rem; letter-spacing: 4px; text-align: center;
        }
        .atm-tela .form-control:focus { border-color: #FFE14D; box-shadow: 0 0 0 .2rem rgba(255,225,77,.25); }
        .atm-tela .alert { font-family: 'Nunito', sans-serif; font-size: .9rem; padding: .5rem .75rem; }
        .atm-saldo { font-size: 2rem; font-weight: 700; color: #7CFFB2; }
        .atm-teclado { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 18px; }
        .atm-tecla {
            border: 0; border-radius: 10px; padding: 14px 0; font-size: 1.2rem; font-weight: 800;
            background: linear-gradient(180deg, #e9e9e9, #bdbdbd); color: #222;
            box-shadow: 0 4px 0 #7a7a7a;
        }
        .atm-tecla:active { transform: translateY(3px); box-shadow: 0 1px 0 #7a7a7a; }
        .atm-tecla.cancelar { background: linear-gradient(180deg, #ff6b6b, #d63a3a); color: #fff; box-shadow: 0 4px 0 #8e1f1f; }
        .atm-tecla.corrigir { background: linear-gradient(180deg, #FFE14D, #e0b800); box-shadow: 0 4px 0 #8a7200; }
        .atm-tecla.confirmar { background: linear-gradient(180deg, #4cd98a, #22a85e); color: #fff; box-shadow: 0 4px 0 #136b3a; }
        .atm-fenda { height: 10px; margin: 18px 40px 0; background: #111; border-radius: 6px; box-shadow: inset 0 2px 4px #000; }
        .atm-legenda { color: #9a9a9a; text-align: center; font-size: .8rem; margin-top: 6px; }
        .atm-op { width: 100%; text-align: left; font-weight: 700; }
        .atm-rapido { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        .atm-rapido button { font-family: 'Courier New', monospace; }
    </style>
</head>
<body>

<!-- Teclado numérico: digita no último campo focado -->
<div th:fragment="teclado">
    <div class="atm-teclado">
        <button type="button" class="atm-tecla" data-tecla="1">1</button>
        <button type="button" class="atm-tecla" data-tecla="2">2</button>
        <button type="button" class="atm-tecla" data-tecla="3">3</button>
        <button type="button" class="atm-tecla cancelar" data-acao="cancelar">ANULA</button>
        <button type="button" class="atm-tecla" data-tecla="4">4</button>
        <button type="button" class="atm-tecla" data-tecla="5">5</button>
        <button type="button" class="atm-tecla" data-tecla="6">6</button>
        <button type="button" class="atm-tecla corrigir" data-acao="corrigir">CORRIGE</button>
        <button type="button" class="atm-tecla" data-tecla="7">7</button>
        <button type="button" class="atm-tecla" data-tecla="8">8</button>
        <button type="button" class="atm-tecla" data-tecla="9">9</button>
        <button type="button" class="atm-tecla confirmar" data-acao="confirmar">ENTRA</button>
        <button type="button" class="atm-tecla" data-tecla="," style="grid-column: 1;">,</button>
        <button type="button" class="atm-tecla" data-tecla="0">0</button>
        <button type="button" class="atm-tecla" data-tecla="00">00</button>
    </div>
    <div class="atm-fenda"></div>
    <div class="atm-legenda">saída de cédulas</div>

    <script>
        (function () {
            let campo = document.querySelector('.atm-tela input[type=text], .atm-tela input[type=password]');
            document.querySelectorAll('.atm-tela input[type=text], .atm-tela input[type=password]').forEach(function (i) {
                i.addEventListener('focus', function () { campo = i; });
            });
            document.querySelectorAll('.atm-tecla').forEach(function (b) {
                b.addEventListener('click', function () {
                    if (!campo) return;
                    const tecla = b.dataset.tecla;
                    const acao = b.dataset.acao;
                    if (tecla) {
                        const valor = tecla === ',' ? '.' : tecla;
                        if (valor === '.' && campo.value.includes('.')) return;
                        const max = campo.maxLength > 0 ? campo.maxLength : 20;
                        if (campo.value.length + valor.length <= max) campo.value += valor;
                    } else if (acao === 'corrigir') {
                        campo.value = campo.value.slice(0, -1);
                    } else if (acao === 'cancelar') {
                        campo.form.querySelectorAll('input[type=text], input[type=password]').forEach(function (i) { i.value = ''; });
                    } else if (acao === 'confirmar') {
                        if (campo.form.reportValidity()) campo.form.submit();
                    }
                    campo.focus();
                });
            });
        })();
    </script>
</div>

</body>
</html>
