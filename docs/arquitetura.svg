<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="setaAzul" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0078D4"/>
    </marker>
    <marker id="setaRoxa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7A3FC4"/>
    </marker>
  </defs>

  <rect width="1200" height="640" fill="#ffffff"/>

  <!-- Titulo -->
  <text x="40" y="44" font-size="24" font-weight="700" fill="#2E2E2E">DimDim Caixa — Arquitetura da Solução (PaaS)</text>
  <text x="40" y="70" font-size="14" fill="#666">Spring Boot MVC + Thymeleaf no Azure App Service, persistência no Azure SQL Database e monitoramento com Application Insights</text>

  <!-- ===== Usuarios ===== -->
  <g transform="translate(40,250)">
    <rect width="170" height="150" rx="14" fill="#FFF8D6" stroke="#E0B800" stroke-width="2"/>
    <circle cx="85" cy="42" r="18" fill="#2E2E2E"/>
    <path d="M52 92 q33 -40 66 0 v6 h-66z" fill="#2E2E2E"/>
    <text x="85" y="122" text-anchor="middle" font-size="15" font-weight="700" fill="#2E2E2E">Clientes e</text>
    <text x="85" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#2E2E2E">Gerentes DimDim</text>
  </g>

  <!-- ===== GitHub ===== -->
  <g transform="translate(40,470)">
    <rect width="170" height="130" rx="14" fill="#F4F4F4" stroke="#24292F" stroke-width="2"/>
    <circle cx="85" cy="40" r="22" fill="#24292F"/>
    <text x="85" y="47" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">GH</text>
    <text x="85" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="#24292F">GitHub</text>
    <text x="85" y="108" text-anchor="middle" font-size="12" fill="#444">Repositório + Actions</text>
    <text x="85" y="123" text-anchor="middle" font-size="12" fill="#444">(build Maven + deploy)</text>
  </g>

  <!-- ===== Cloud Shell ===== -->
  <g transform="translate(40,100)">
    <rect width="170" height="110" rx="14" fill="#EAF4FC" stroke="#0078D4" stroke-width="2"/>
    <rect x="58" y="16" width="54" height="36" rx="5" fill="#1F1F1F"/>
    <text x="85" y="40" text-anchor="middle" font-size="14" font-weight="700" fill="#7CFFB2" font-family="Consolas, monospace">&gt;_</text>
    <text x="85" y="76" text-anchor="middle" font-size="15" font-weight="700" fill="#0B4F8A">Azure Cloud Shell</text>
    <text x="85" y="96" text-anchor="middle" font-size="12" fill="#444">Azure CLI (scripts/)</text>
  </g>

  <!-- ===== Azure ===== -->
  <rect x="290" y="95" width="880" height="520" rx="20" fill="#F3F9FF" stroke="#0078D4" stroke-width="2.5" stroke-dasharray="10 6"/>
  <text x="315" y="128" font-size="18" font-weight="700" fill="#0078D4">Microsoft Azure</text>

  <!-- Resource group -->
  <rect x="315" y="145" width="830" height="445" rx="14" fill="#ffffff" stroke="#8AB8E6" stroke-width="1.5"/>
  <text x="335" y="172" font-size="14" font-weight="700" fill="#0B4F8A">Resource Group: rg-dimdim-caixa</text>

  <!-- App Service Plan + Web App -->
  <g transform="translate(345,200)">
    <rect width="330" height="250" rx="12" fill="#EAF4FC" stroke="#0078D4" stroke-width="1.5"/>
    <text x="16" y="26" font-size="13" font-weight="700" fill="#0B4F8A">App Service Plan (Linux, F1)</text>
    <g transform="translate(25,45)">
      <rect width="280" height="185" rx="12" fill="#ffffff" stroke="#0078D4" stroke-width="2"/>
      <!-- icone web app -->
      <circle cx="44" cy="46" r="26" fill="#0078D4"/>
      <ellipse cx="44" cy="46" rx="11" ry="26" fill="none" stroke="#fff" stroke-width="2"/>
      <line x1="18" y1="46" x2="70" y2="46" stroke="#fff" stroke-width="2"/>
      <text x="86" y="40" font-size="16" font-weight="700" fill="#0B4F8A">Web App</text>
      <text x="86" y="60" font-size="12" fill="#444">dimdim-caixa-rmXXXX</text>
      <text x="20" y="100" font-size="12" fill="#333">• Java 17 · Spring Boot 3 (MVC)</text>
      <text x="20" y="120" font-size="12" fill="#333">• Front-end Thymeleaf</text>
      <text x="20" y="140" font-size="12" fill="#333">• Caixa eletrônico + gerência</text>
      <text x="20" y="160" font-size="12" fill="#333">• Agente Java do App Insights</text>
      <text x="20" y="177" font-size="11" fill="#777">credenciais nas App Settings</text>
    </g>
  </g>

  <!-- Azure SQL -->
  <g transform="translate(790,200)">
    <rect width="330" height="250" rx="12" fill="#EAF4FC" stroke="#0078D4" stroke-width="1.5"/>
    <text x="16" y="26" font-size="13" font-weight="700" fill="#0B4F8A">Azure SQL Server (lógico)</text>
    <g transform="translate(25,45)">
      <rect width="280" height="185" rx="12" fill="#ffffff" stroke="#0078D4" stroke-width="2"/>
      <!-- icone banco -->
      <ellipse cx="44" cy="26" rx="24" ry="9" fill="#0078D4"/>
      <rect x="20" y="26" width="48" height="40" fill="#0078D4"/>
      <ellipse cx="44" cy="66" rx="24" ry="9" fill="#005A9E"/>
      <ellipse cx="44" cy="26" rx="24" ry="9" fill="#50A0E6"/>
      <text x="86" y="40" font-size="16" font-weight="700" fill="#0B4F8A">Azure SQL Database</text>
      <text x="86" y="60" font-size="12" fill="#444">db-dimdim (Basic)</text>
      <text x="20" y="100" font-size="12" fill="#333">• Tabela cliente</text>
      <text x="20" y="120" font-size="12" fill="#333">• Tabela conta (FK cliente_id)</text>
      <text x="20" y="140" font-size="12" fill="#333">• Relacionamento 1:N</text>
      <text x="20" y="160" font-size="12" fill="#333">• Firewall: serviços do Azure</text>
    </g>
  </g>

  <!-- App Insights -->
  <g transform="translate(570,478)">
    <rect width="330" height="92" rx="12" fill="#F4EEFC" stroke="#7A3FC4" stroke-width="2"/>
    <rect x="22" y="22" width="10" height="48" rx="2" fill="#7A3FC4"/>
    <rect x="38" y="38" width="10" height="32" rx="2" fill="#9B6BDB"/>
    <rect x="54" y="30" width="10" height="40" rx="2" fill="#7A3FC4"/>
    <text x="84" y="40" font-size="16" font-weight="700" fill="#5A2A9E">Application Insights</text>
    <text x="84" y="60" font-size="12" fill="#444">requisições, falhas, performance</text>
    <text x="84" y="77" font-size="12" fill="#444">e dependências SQL (App + Banco)</text>
  </g>

  <!-- ===== Setas ===== -->
  <!-- Usuario -> Web App -->
  <line x1="210" y1="325" x2="368" y2="325" stroke="#333" stroke-width="2.5" marker-end="url(#seta)"/>
  <text x="222" y="314" font-size="12" font-weight="700" fill="#333">HTTPS</text>

  <!-- GitHub -> Web App -->
  <path d="M210 535 H300 Q330 535 330 505 V420 Q330 400 368 400" fill="none" stroke="#24292F" stroke-width="2.5" marker-end="url(#seta)"/>
  <text x="218" y="555" font-size="12" font-weight="700" fill="#24292F">deploy do .jar</text>

  <!-- Cloud Shell -> Resource Group -->
  <path d="M210 155 H315" fill="none" stroke="#0078D4" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#setaAzul)"/>
  <text x="216" y="146" font-size="12" font-weight="700" fill="#0078D4">provisiona</text>

  <!-- Web App -> SQL -->
  <line x1="650" y1="330" x2="812" y2="330" stroke="#0078D4" stroke-width="2.5" marker-end="url(#setaAzul)"/>
  <text x="672" y="318" font-size="12" font-weight="700" fill="#0078D4">JDBC (TLS) :1433</text>
  <text x="672" y="350" font-size="11" fill="#0078D4">JPA / Hibernate</text>

  <!-- Web App -> App Insights -->
  <path d="M510 430 V524 H568" fill="none" stroke="#7A3FC4" stroke-width="2.5" marker-end="url(#setaRoxa)"/>
  <text x="440" y="500" font-size="12" font-weight="700" fill="#7A3FC4">telemetria</text>
</svg>
